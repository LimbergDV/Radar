[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-mcp"
version = "0.1.0"
description = "Servidor MCP que expone el contenido de Radar a agentes externos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
radar-mcp = "radar_mcp.server:main"
radar-cli = "radar_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["radar_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: pega a la API real de Railway (solo con RADAR_LIVE=1)",
]